model_dir = "models/faster-whisper-base.en"
max_duration_sec = 7200
audio_recheck = true
community1_cache = "models/community-1-hf-cache"
community1_device = "cpu"
# Keep empty: the worker inherits the current uv-managed interpreter.
community1_python = ""
worker_timeout_sec = 7200
semantic_provider = "none"
allow_semantic_network = false
semantic_max_calls = 1

# English cue limits; count spaces and punctuation. Short complete replies are allowed.
[subtitle]
target_min_chars = 35
max_chars = 42
min_duration_sec = 2.0
max_duration_sec = 4.0
max_cps = 20.0
