# tts_align 节点配置，由 D 维护。
# 音色映射作为配置项维护（workflow.md 第 3 节），改这里不需要改代码。

# 合成模型标识，原样写入 TTSClip.model
model = "cosyvoice-v3-flash"

# 逐段音频与 audio/dub.wav 的采样率（CosyVoice 原生 24kHz）
sample_rate = 24000

# 音色池：按说话人首次出现顺序依次分配，保证同一说话人全片一致。
# 双人素材使用两种普通话音色，来自 .env.example 的 LOCALIZER_VOICES。
voices = ["longanyang", "longanhuan_v3"]

# spk_unknown 固定使用这个音色，不占用音色池名额。
# 用它保证未知说话人不会被随意指派成某个真人音色。
fallback_voice = "longanyang"

# 未知说话人的 speaker_id。该值固定使用 fallback_voice，不占用音色池名额。
# 对应 docs/design/increments/README.md 中仍待决策的契约问题；
# 放在配置里，最终结论变化时不需要改代码。
unknown_speaker = "spk_unknown"

# 手工指定 speaker_id 的音色，优先级高于音色池。
# 人工回听发现两个 speaker_id 其实是同一个人时，在这里把两者指到同一音色即可合并。
[overrides]
