<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" width="1200" height="396" role="img" aria-labelledby="title description">
  <title id="title">英文视频译制流程</title>
  <desc id="description">识别英文语音后，翻译审校与背景音处理并行。按配音音轨生成字幕后汇合，输出中文配音和双语字幕视频。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="m2 1 5 4-5 4" fill="none" stroke="#92a8b8" stroke-width="1.7"/>
    </marker>
  </defs>
  <rect width="1200" height="396" rx="24" fill="#101a23"/>
  <g font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">
    <text x="64" y="72" font-size="44" font-weight="700" fill="#f1f5f8">从英文原片到中文成片</text>
    <g fill="none" stroke="#92a8b8" stroke-width="2" marker-end="url(#arrow)">
      <path d="M304 193 H342"/>
      <path d="M559 193 H597"/>
      <path d="M849 193 H892"/>
      <path d="M184 241 V314 H340"/>
      <path d="M849 314 H997 V245"/>
    </g>
    <g stroke-width="1.5">
      <rect x="64" y="145" width="240" height="96" rx="14" fill="#182933" stroke="#3f7983"/>
      <rect x="348" y="145" width="211" height="96" rx="14" fill="#182933" stroke="#3f7983"/>
      <rect x="603" y="145" width="246" height="96" rx="14" fill="#182933" stroke="#3f7983"/>
      <rect x="898" y="145" width="238" height="96" rx="14" fill="#342a23" stroke="#c68f61"/>
      <rect x="348" y="276" width="501" height="76" rx="14" fill="#1b2631" stroke="#546f86"/>
    </g>
    <g text-anchor="middle" font-size="30" font-weight="650" fill="#d6f4f2">
      <text x="184" y="204">语音识别</text>
      <text x="454" y="204">翻译审校</text>
      <text x="726" y="204">配音与字幕</text>
      <text x="1017" y="204" fill="#ffdbb5">混音与合成</text>
      <text x="598" y="325" fill="#d9e5f0">并行分离背景音</text>
    </g>
  </g>
</svg>
