[project]
name = "english-video-localizer"
version = "0.1.0"
description = "Checkpointed English-to-Mandarin video localization"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pillow>=11,<14",
    "pydantic>=2.11,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
speech = [
    "dashscope>=2.0.1,<3",
    "faster-whisper>=1.2,<2",
    "huggingface-hub>=2.4.0",
    "numpy>=1.26,<3",
    "pyannote-audio>=4,<5",
    "torch>=2.8,<3",
    "torchaudio>=2.8,<3",
]
b-asr = [
    "av>=16.1,<17",
    "en-core-web-sm",
    "faster-whisper>=1.2,<2",
    "numpy>=1.26,<3",
    "spacy>=3.8,<3.9",
    "yt-dlp>=2026.10.26",
    "yt-dlp-ejs>=0.8,<1",
]
b-legacy = [
    "sherpa-onnx>=2,<3",
]
tts = [
    "dashscope>=2.0.1,<3",
]

[dependency-groups]
dev = ["imageio-ffmpeg>=0.8,<1", "pytest>=8,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.scripts]
run-input = "cli:main"

[tool.setuptools]
py-modules = ["cli", "subtitle_templates"]
package-dir = {"" = "project"}

[tool.setuptools.packages.find]
where = ["project"]
include = [
    "graph",
    "graph.*",
    "contracts",
    "contracts.*",
    "nodes",
    "nodes.*",
    "mocks",
    "mocks.*",
    "utils",
    "utils.*",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["project"]
markers = [
    "slow: end to end slow test",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
