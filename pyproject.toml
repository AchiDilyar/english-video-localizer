[project]
name = "english-video-localizer"
version = "0.1.0"
description = "Checkpointed English-to-Mandarin video localization"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.28,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pillow>=11,<14",
    "pydantic>=2.11,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
speech = [
    "dashscope>=2.0.1,<3",
    "faster-whisper>=1.2,<2",
    "pyannote-audio>=4,<5",
]

[dependency-groups]
dev = ["imageio-ffmpeg>=0.8,<1", "pytest>=8,<10", "ruff>=0.14,<1"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "video_localizer"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["project"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
